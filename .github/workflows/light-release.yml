name: Build Hermes Light for Mac

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: light-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Build the pinned Light artifact
        run: |
          test "$(uname -m)" = arm64
          python3 scripts/light/test_macos_identity.py
          python3 scripts/bundles/desktop.py --commit "$GITHUB_SHA" --variant light
      - name: Verify the packaged client
        run: python3 scripts/light/verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hermes-light-macos-arm64
          path: light-release/
          if-no-files-found: error
      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: light-build-diagnostics
          path: |
            apps/desktop/release/builder-debug.yml
            .build/desktop-job/request.json
            light-release/*.png
            light-release/*.json
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name hermes-light-macos-arm64 --dir release
          tag="light-r${GITHUB_RUN_NUMBER}"
          gh release create "$tag" release/* --target "$GITHUB_SHA" \
            --title "Hermes Light for Mac · r${GITHUB_RUN_NUMBER}" \
            --notes-file release/INSTALL.md --latest
